[package]
name = "rotocore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Moto-equivalent AWS service engine in pure Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bytes = "1.5"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
md5 = "0.7"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
parking_lot = "0.12"
once_cell = "1.19"
urlencoding = "2.1"
# Sync HTTP loopback client for the resource mirror (CFN -> sibling services);
# no TLS needed: the mirror only ever talks to the local host over http.
ureq = { version = "2.10", default-features = false }
