[package]
name = "rotocore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Moto-equivalent AWS service engine in pure Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
bytes = "1.5"
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"
md5 = "0.7"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# AppRegistry's CFN_STACK recognizer (verbatim moto regex translation).
regex = "1.10"
parking_lot = "0.12"
once_cell = "1.19"
urlencoding = "2.1"
# CloudFront rest-xml request parsing (shares the workspace's 0.31 pin).
quick-xml = "0.31"
# Sync HTTP loopback client for the resource mirror (CFN -> sibling services);
# no TLS needed: the mirror only ever talks to the local host over http.
ureq = { version = "2.10", default-features = false }
# Cross-service reads (CreateTrail's S3-bucket existence check mirrors moto's
# `s3_backends[...].get_bucket` probe via the s3 crate's state bridge).
s3 = { path = "../crates/s3" }
# Dynamodbstreams reads stream metadata and captured mutation records from
# the dynamodb crate through its cross-service bridge (moto parity:
# DynamoDBStreamsBackend reaches into dynamodb_backends for tables).
dynamodb = { path = "../crates/dynamodb" }
