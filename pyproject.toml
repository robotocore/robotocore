[project]
name = "robotocore-tests"
version = "0.0.0"
description = "pytest/boto3 test rig for robotocore (the server is pure Rust — see rotocore/ and src/)"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["aws", "mock", "testing", "emulator", "cloud"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Framework :: Pytest",
]

# Python here is ONLY the test driver: pytest launches boto3 clients at a
# running robotocore server (pure Rust). No server code lives in Python.
dependencies = [
    "boto3>=1.34",
    "cryptography>=50.0.2",
    "requests>=2.34.2",
]

# Synced by the CI workflows (`uv sync --extra dev`) that predate the ape-era
# uv dependency-groups split; the group below carries the same pins.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.5",
    # The ECR OCI-registry compat suite drives the raw registry data plane.
    "httpx>=0.27",
    # ci.yml unit shards report coverage, lint runs mypy + bandit.
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "bandit>=1.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.5",
    # The ECR OCI-registry compat suite drives the raw registry data plane.
    "httpx>=0.27",
    # ci.yml unit shards report coverage, lint runs mypy + bandit.
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "bandit>=1.7",
]

[tool.uv]
# Virtual project: no python distribution is built/installed from the root —
# `uv sync` just provisions the pytest driver environment.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
# Deferred python: these paths predate the Rust port and are preserved for
# reference rather than wired to lint/format gates. Live scripts stay linted.
exclude = [
    # python-provider-era test suites parked by the quarantine lane
    "tests/legacy-py-provider",
    "tests/compatibility/legacy-py-provider",
    # python-era provider remnants kept in-tree (reference, no longer server)
    "src/robotocore/services",
    # deferred porting/parity wave tooling (python era)
    "scripts/harness",
    "tooling",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
# Every python file under src/robotocore/services/ is a python-provider-era
# remnant kept in-tree for reference; the Rust port owns the real services
# now. Keep mypy's entry point (ci.yml runs `mypy src/robotocore/`) on the
# live python under src/robotocore/testing/ only.
exclude = "^src/robotocore/services/"

[tool.bandit]
# Bandit config read from pyproject (ci.yml runs `bandit -c pyproject.toml`).
# src/robotocore/services/** are python-provider-era remnants preserved for
# reference — the Rust port owns the real service code — so their scanner
# findings are historical, not live surface.
exclude_dirs = ["src/robotocore/services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "iac: IaC integration tests (requires running server)",
    "compat: Compatibility tests (requires running server)",
]
