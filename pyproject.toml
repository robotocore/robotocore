[project]
name = "robotocore-tests"
version = "0.0.0"
description = "pytest/boto3 test rig for robotocore (the server is pure Rust — see rotocore/ and src/)"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["aws", "mock", "testing", "emulator", "cloud"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Framework :: Pytest",
]

# Python here is ONLY the test driver: pytest launches boto3 clients at a
# running robotocore server (pure Rust). No server code lives in Python.
dependencies = [
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.5",
]

[tool.uv]
# Virtual project: no python distribution is built/installed from the root —
# `uv sync` just provisions the pytest driver environment.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "iac: IaC integration tests (requires running server)",
    "compat: Compatibility tests (requires running server)",
]
