[project]
name = "robotocore"
version = "0.0.0"
description = "Free, open-source AWS emulator — the Rust server is the product; this Python project now only ships the pytest test rig and the moto-sidecar runtime"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Jack Danger", email = "github@jackcanfield.com" },
]
keywords = ["aws", "mock", "localstack", "moto", "testing", "emulator", "cloud"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Mocking",
    "Framework :: Pytest",
]

# Driver is Python (pytest + boto3); the server under test is Rust. Python
# here is only the parity/pytest driver plus the moto sidecar that serves the
# moto-backed services.
dependencies = [
    "boto3>=1.34",
    "moto[all]>=5.0",
    "uvicorn>=0.30",
    "starlette>=0.38",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "pytest-cov>=5.0",
    "pytest-rerunfailures>=14.0",
    "coverage>=7.5",
    "pre-commit>=3.7",
    "ruff>=0.5",
    "freezegun>=1.5.5",
    "pytest-playwright>=0.7.2",
]

[tool.uv]
# Virtual project: no python distribution is built/installed from the root —
# `uv sync` just provisions the driver environment (pytest + sidecar deps).
package = false

[tool.uv.sources]
# Moto installed from our fork with parity-service fixes; keep in lockstep
# with what .parity/expectations_current.json was measured against.
moto = { git = "https://github.com/JackDanger/moto.git", branch = "robotocore/all-fixes" }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_slides.py" = ["E501"]  # HTML/CSS/JS template strings can't be line-wrapped
"scripts/coverage_gaps.py" = ["E501"]
"scripts/lint_project.py" = ["E501"]
"scripts/validate_app_tests.py" = ["E501"]
"scripts/validate_test_quality.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "iac: IaC integration tests (requires running server)",
    "compat: Compatibility tests (requires running server)",
    "integration: Integration tests",
    "parity: AWS parity tests (requires running server)",
]
