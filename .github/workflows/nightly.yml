name: Nightly

on:
  schedule:
    # 4am UTC daily
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  full-iac:
    name: "nightly: all IaC frameworks"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install -g serverless aws-cdk
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.x"
      - uses: pulumi/actions@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Start rust server (+ moto sidecar)
        run: RUST_ONLY=1 RUST_PORT=4566 LOG_PREFIX=nightly bash scripts/start_parity_servers.sh
      - name: Run all IaC tests
        run: >
          ENDPOINT_URL=http://localhost:4566
          uv run pytest tests/iac/ -v --tb=short
          --junitxml=results-nightly-iac.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-iac-results
          path: results-nightly-iac.xml
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-server-log-iac
          path: |
            /tmp/nightly_rust.log
            /tmp/nightly_sidecar.log

  full-parity:
    name: "nightly: parity + compatibility (rust-only)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUST_PORT: "4566"
      LOG_PREFIX: parity
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Start rust server (+ moto sidecar)
        run: RUST_ONLY=1 LOG_PREFIX=parity bash scripts/start_parity_servers.sh
      - name: Run parity harness (rust-only)
        run: uv run python scripts/harness/parity.py --rust-only

  notify:
    name: "nightly: notify on failure"
    runs-on: ubuntu-latest
    if: failure()
    needs: [full-iac, full-parity]
    steps:
      - name: Create failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_url = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            // Check if there's already an open nightly failure issue
            const existing = await github.rest.issues.listForRepo({
              owner, repo,
              labels: 'nightly-failure',
              state: 'open',
            });
            if (existing.data.length > 0) {
              // Comment on existing issue
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: existing.data[0].number,
                body: `Nightly run failed again on ${today}: ${run_url}`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: `Nightly CI failure: ${today}`,
                body: `The nightly CI run failed.\n\n**Run:** ${run_url}\n\nCheck the logs for details.`,
                labels: ['nightly-failure'],
              });
            }
