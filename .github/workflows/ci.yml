name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Kept as an advisory check (keys on src/tests/scripts, which still exist in
  # this phase); no longer a hard gate since the python server is being ported.
  prompt-log:
    name: Prompt log check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check for prompt log entry
        run: |
          CODE=$(git diff --name-only --diff-filter=ACM origin/${{ github.base_ref }}...HEAD \
            | grep -E '^(src/|tests/|scripts/)' || true)
          PROMPTS=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }}...HEAD \
            | grep '^prompts/' || true)
          if [ -z "$CODE" ]; then
            echo "✓ No source/test changes — prompt log not required."
            exit 0
          fi
          if [ -z "$PROMPTS" ]; then
            echo "✗ This PR changes source/tests but adds no prompt log."
            echo ""
            echo "  Add a file to prompts/YYYYMMDD-HHMMSS-<slug>.md documenting"
            echo "  the human prompts and key assistant decisions in this PR."
            echo "  See .claude/skills/promptlog.md for format."
            exit 1
          fi
          echo "✓ Prompt log present: $PROMPTS"

  rust-ci:
    name: Rust CI (fmt + clippy + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release

  # Rust-only parity: starts the rust server (rotocore native) and runs the
  # parity harness against the checked-in expectations baseline.
  # Exit code 2 = expectations drift = red; no baseline promotion here
  # (do that manually from a clean local run with --update-expectations).
  compat-rust:
    name: "compat: rust-only parity gate"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # parity.py re-derives the server from these (it kills/restarts the rust
      # server itself; RUST_PORT must match what the start script bound).
      RUST_PORT: "4566"
      LOG_PREFIX: ci
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Start rust server (rotocore native)
        run: RUST_PORT=4566 LOG_PREFIX=ci bash scripts/start_parity_servers.sh
      - name: Run parity harness (rust-only)
        run: uv run python scripts/harness/parity.py --rust-only
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-compat-rust
          path: /tmp/ci_rust.log

  # ── pytest rigs against the rust server ───────────────────────────────────
  # The python driver stays as THE test rig; the server under test is the
  # rust binary (rotocore serves every service natively — no sidecar).

  compatibility-tests:
    name: "compat: ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # a-g: ~5200 tests (acm, batch, cloudwatch, dynamodb, ec2, ecs, events, glue, iam…)
          - shard: "a-g"
            pattern: "tests/compatibility/test_[a-g]*.py"
          # h-r: ~3800 tests (iam, kinesis, lambda, logs, opensearch, rds, route53, rekognition…)
          - shard: "h-r"
            pattern: "tests/compatibility/test_[h-r]*.py"
          # s-z: ~2700 tests (s3, scheduler, secretsmanager, ses, sns, sqs, ssm, stepfunctions…)
          - shard: "s-z"
            pattern: "tests/compatibility/test_[s-z]*.py"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Start rust server (rotocore native)
        run: RUST_PORT=4566 LOG_PREFIX=ci bash scripts/start_parity_servers.sh
      - name: Run per-service compatibility tests (${{ matrix.shard }})
        run: >
          ENDPOINT_URL=http://localhost:4566
          uv run pytest ${{ matrix.pattern }}
          --ignore=tests/compatibility/test_cross_service_compat.py
          -n8 --dist=loadfile -q --tb=short
          --junitxml=results-compat-${{ matrix.shard }}.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-compat-${{ matrix.shard }}
          path: results-compat-${{ matrix.shard }}.xml
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-compat-${{ matrix.shard }}
          path: /tmp/ci_rust.log

  # Roll-up so the "compatibility-tests" branch protection rule resolves.
  # The matrix shards report as "compat: a-g" etc., not "compatibility-tests".
  compatibility-tests-rollup:
    name: compatibility-tests
    runs-on: ubuntu-latest
    if: always()
    needs: [compatibility-tests]
    steps:
      - run: |
          if [ "${{ needs.compatibility-tests.result }}" != "success" ]; then
            echo "One or more compat shards failed"
            exit 1
          fi

  cross-service-tests:
    name: "compat: cross-service integrations"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Start rust server (rotocore native)
        run: RUST_PORT=4566 LOG_PREFIX=ci bash scripts/start_parity_servers.sh
      - name: Run cross-service integration tests
        run: >
          ENDPOINT_URL=http://localhost:4566
          uv run pytest
          tests/compatibility/test_cross_service_compat.py
          tests/compatibility/chaos/test_chaos_engineering_compat.py
          -v --tb=short
          --junitxml=results-cross-service.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-cross-service
          path: results-cross-service.xml
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-cross-service
          path: /tmp/ci_rust.log

  iac-tests:
    name: "iac: CloudFormation + SAM + Serverless"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Start rust server (rotocore native)
        run: RUST_PORT=4566 LOG_PREFIX=ci bash scripts/start_parity_servers.sh
      - name: Run IaC tests (CFN, SAM, Serverless)
        run: >
          ENDPOINT_URL=http://localhost:4566
          uv run pytest
          tests/iac/cloudformation/
          tests/iac/sam/
          tests/iac/serverless/
          -v --tb=short
          --reruns=2 --reruns-delay=1
          --junitxml=results-iac.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-iac
          path: results-iac.xml
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-iac
          path: /tmp/ci_rust.log

  # ── Docker + final gates ───────────────────────────────────────────────────

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - rust-ci
      - compat-rust
      - compatibility-tests
      - cross-service-tests
      - iac-tests
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image (rust, distroless runtime)
        run: docker build -t robotocore:rust .

      - name: Container security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: robotocore:rust
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

      # Smoke: run with --network host and probe the published service over
      # the loopback interface. The server image has no extra tooling inside
      # (distroless), so all verification happens from the host side.
      - name: Start container and verify health
        run: |
          docker run -d --network host --name robotocore-smoke robotocore:rust
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4566/_robotocore/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4566/_robotocore/health

      - name: Runtime smoke tests (native services)
        run: |
          pip install --upgrade boto3 --quiet
          python3 -c "
          import boto3

          ep = 'http://127.0.0.1:4566'
          creds = dict(aws_access_key_id='123456789012', aws_secret_access_key='test',
                       region_name='us-east-1')

          s3 = boto3.client('s3', endpoint_url=ep, **creds)
          s3.create_bucket(Bucket='smoke-bucket')
          s3.put_object(Bucket='smoke-bucket', Key='smoke.txt', Body=b'hello')
          assert s3.get_object(Bucket='smoke-bucket', Key='smoke.txt')['Body'].read() == b'hello'
          print('S3 smoke test passed')

          sqs = boto3.client('sqs', endpoint_url=ep, **creds)
          q = sqs.create_queue(QueueName='smoke-queue')['QueueUrl']
          sqs.send_message(QueueUrl=q, MessageBody='hello')
          msgs = sqs.receive_message(QueueUrl=q, MaxNumberOfMessages=10).get('Messages', [])
          assert msgs and msgs[0]['Body'] == 'hello', f'SQS: expected message, got {msgs}'
          print('SQS smoke test passed')
          "

      - name: Stop smoke container
        if: always()
        run: docker rm -f robotocore-smoke || true

  # ── Aggregate results ─────────────────────────────────────────────────────

  test-summary:
    name: "Test summary"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - compatibility-tests
      - cross-service-tests
      - iac-tests
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          merge-multiple: true
          path: test-results/
      - name: Test results summary
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          total_tests=0
          total_failures=0
          total_errors=0
          total_skipped=0
          for f in test-results/*.xml; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .xml | sed 's/^results-//')
            tests=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*' || echo 0)
            failures=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*' || echo 0)
            errors=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*' || echo 0)
            skipped=$(grep -o 'skipped="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*' || echo 0)
            time=$(grep -o 'time="[0-9.]*"' "$f" | head -1 | grep -o '[0-9.]*' || echo 0)
            total_tests=$((total_tests + tests))
            total_failures=$((total_failures + failures))
            total_errors=$((total_errors + errors))
            total_skipped=$((total_skipped + skipped))
            status="✅"
            if [ "$failures" -gt 0 ] || [ "$errors" -gt 0 ]; then status="❌"; fi
            echo "| ${status} ${name} | ${tests} | ${failures} | ${errors} | ${skipped} | ${time}s |" >> results.md
          done
          echo "| Suite | Tests | Failures | Errors | Skipped | Time |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|----------|--------|---------|------|" >> $GITHUB_STEP_SUMMARY
          cat results.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: ${total_tests} tests, ${total_failures} failures, ${total_errors} errors, ${total_skipped} skipped**" >> $GITHUB_STEP_SUMMARY
          if [ "$total_failures" -gt 0 ] || [ "$total_errors" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Some tests failed. Check individual job logs for details." >> $GITHUB_STEP_SUMMARY
          fi
