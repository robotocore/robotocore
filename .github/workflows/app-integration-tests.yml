name: App Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  app-tests:
    name: "App: ${{ matrix.app }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app:
          - cicd_pipeline
          - content_mgmt
          - data_pipeline
          - ecommerce_order
          - event_chain
          - event_driven
          - file_processing
          - message_queue
          - multitenant_saas
          - notification_dispatch
          - scheduled_tasks
          - secrets_rotation
          - serverless_api
          - user_auth
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Start rust server (+ moto sidecar)
        run: RUST_PORT=4566 LOG_PREFIX=app bash scripts/start_parity_servers.sh
      - name: Run app integration tests
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
        run: uv run pytest tests/apps/${{ matrix.app }}/ -v --tb=short --reruns=2 --reruns-delay=2 --junitxml=results-${{ matrix.app }}.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-app-${{ matrix.app }}
          path: results-${{ matrix.app }}.xml
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-${{ matrix.app }}
          path: |
            /tmp/app_rust.log
            /tmp/app_sidecar.log
