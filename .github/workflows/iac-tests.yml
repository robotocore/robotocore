name: IaC Tests

on:
  push:
    branches: [main]
    paths:
      - "tests/iac/**"
      - "rotocore/**"
      - "crates/**"
      - "src/**"
  pull_request:
    branches: [main]
    paths:
      - "tests/iac/**"
      - "rotocore/**"
      - "crates/**"
      - "src/**"

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.x"
      - run: uv sync
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Start rust server (+ moto sidecar)
        run: RUST_ONLY=1 RUST_PORT=4566 LOG_PREFIX=iac bash scripts/start_parity_servers.sh
      - name: Run Terraform IaC tests
        run: >
          ENDPOINT_URL=http://localhost:4566
          uv run pytest tests/iac/terraform/ -q --tb=short --junitxml=results-iac-terraform.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-iac-terraform
          path: results-iac-terraform.xml
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-iac-terraform
          path: |
            /tmp/iac_rust.log
            /tmp/iac_sidecar.log

  cloudformation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Start rust server (+ moto sidecar)
        run: RUST_ONLY=1 RUST_PORT=4566 LOG_PREFIX=iac bash scripts/start_parity_servers.sh
      - name: Run CloudFormation IaC tests
        run: >
          ENDPOINT_URL=http://localhost:4566
          uv run pytest tests/iac/cloudformation/ -q --tb=short --junitxml=results-iac-cloudformation.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-iac-cloudformation
          path: results-iac-cloudformation.xml
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-iac-cloudformation
          path: |
            /tmp/iac_rust.log
            /tmp/iac_sidecar.log

  cdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install -g aws-cdk
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Start rust server (+ moto sidecar)
        run: RUST_ONLY=1 RUST_PORT=4566 LOG_PREFIX=iac bash scripts/start_parity_servers.sh
      - name: Run CDK IaC tests
        run: >
          ENDPOINT_URL=http://localhost:4566
          uv run pytest tests/iac/cdk/ -q --tb=short --junitxml=results-iac-cdk.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-iac-cdk
          path: results-iac-cdk.xml
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-iac-cdk
          path: |
            /tmp/iac_rust.log
            /tmp/iac_sidecar.log

  pulumi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: pulumi/actions@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Start rust server (+ moto sidecar)
        run: RUST_ONLY=1 RUST_PORT=4566 LOG_PREFIX=iac bash scripts/start_parity_servers.sh
      - name: Run Pulumi IaC tests
        run: >
          ENDPOINT_URL=http://localhost:4566
          uv run pytest tests/iac/pulumi/ -q --tb=short --junitxml=results-iac-pulumi.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-iac-pulumi
          path: results-iac-pulumi.xml
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-iac-pulumi
          path: |
            /tmp/iac_rust.log
            /tmp/iac_sidecar.log

  serverless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install -g serverless
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Start rust server (+ moto sidecar)
        run: RUST_ONLY=1 RUST_PORT=4566 LOG_PREFIX=iac bash scripts/start_parity_servers.sh
      - name: Run Serverless Framework IaC tests
        run: >
          ENDPOINT_URL=http://localhost:4566
          uv run pytest tests/iac/serverless/ -q --tb=short --junitxml=results-iac-serverless.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-iac-serverless
          path: results-iac-serverless.xml
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-iac-serverless
          path: |
            /tmp/iac_rust.log
            /tmp/iac_sidecar.log

  sam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install aws-sam-cli
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Start rust server (+ moto sidecar)
        run: RUST_ONLY=1 RUST_PORT=4566 LOG_PREFIX=iac bash scripts/start_parity_servers.sh
      - name: Run SAM IaC tests
        run: >
          ENDPOINT_URL=http://localhost:4566
          uv run pytest tests/iac/sam/ -q --tb=short --junitxml=results-iac-sam.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-iac-sam
          path: results-iac-sam.xml
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-iac-sam
          path: |
            /tmp/iac_rust.log
            /tmp/iac_sidecar.log
