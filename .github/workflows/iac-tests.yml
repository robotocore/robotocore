name: IaC Tests

on:
  push:
    branches: [main]
    paths:
      - "tests/iac/**"
      - "src/robotocore/**"
  pull_request:
    branches: [main]
    paths:
      - "tests/iac/**"
      - "src/robotocore/**"

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.x"
      - run: uv sync --extra dev
      # Twin built from THIS checkout (cached); never the published image —
      # gates must test the code under review, not a release artifact.
      - name: Start robotocore from source
        uses: ./.github/actions/start-twin-from-source
      - name: Run Terraform IaC tests
        run: >
          ENDPOINT_URL=http://localhost:4566
          uv run pytest tests/iac/terraform/ -q --tb=short --junitxml=results-iac-terraform.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-iac-terraform
          path: results-iac-terraform.xml
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-iac-terraform
          path: .robotocore.log
          include-hidden-files: true

  cloudformation:
