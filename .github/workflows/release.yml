name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # Gate: rust quality checks must pass before publishing.
  rust-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  build-and-publish:
    runs-on: ubuntu-latest
    needs: [rust-checks]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # need full history for CalVer tags

      # Multi-arch Docker build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Docker Hub — short, conventional image name (robotocore/robotocore:latest)
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # CalVer: YYYY.M.D, with .N suffix for same-day releases
      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            BASE="$(date -u +%Y.%-m.%-d)"
            EXISTING=$(git tag -l "v${BASE}" "v${BASE}.*" | wc -l | tr -d ' ')
            if [ "$EXISTING" -eq 0 ]; then
              VERSION="$BASE"
            else
              VERSION="${BASE}.${EXISTING}"
            fi
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      # Tag the commit before building so the version arg lands in the image
      - name: Create git tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          git tag "v${{ steps.version.outputs.VERSION }}"

      # Single image: cargo-built binary on a distroless runtime.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ROBOTOCORE_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            robotocore/robotocore:${{ steps.version.outputs.VERSION }}
            robotocore/robotocore:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Runtimes variant: Debian-slim runner + Node.js 20 + Ruby 3.3
      - name: Build and push runtimes Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtimes
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ROBOTOCORE_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            robotocore/robotocore:${{ steps.version.outputs.VERSION }}-runtimes
            robotocore/robotocore:runtimes
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}-runtimes
            ghcr.io/${{ github.repository }}:runtimes
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # java-and-dotnet variant: runtimes + OpenJDK 21 + .NET SDK 8
      - name: Build and push java-and-dotnet Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: java-and-dotnet
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ROBOTOCORE_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            robotocore/robotocore:${{ steps.version.outputs.VERSION }}-java-and-dotnet
            robotocore/robotocore:java-and-dotnet
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}-java-and-dotnet
            ghcr.io/${{ github.repository }}:java-and-dotnet
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Push the tag after a successful build
      - name: Push git tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          git push origin "v${{ steps.version.outputs.VERSION }}"

      # GitHub Release with notes from the latest CHANGELOG.md section
      - name: Extract latest changelog section
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          awk '/^## /{if (n++) exit} n' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "See [CHANGELOG.md](./CHANGELOG.md) for details." > release_notes.md
          fi
          cat release_notes.md

      - name: Create GitHub Release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
