name: AWS Parity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  parity-tests:
    name: "AWS parity tests"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The probe-freshness gate attributes probes to the newest commit
      # per service path via `git log` — a shallow checkout (GH default)
      # leaves the merge tip as the only commit and marks every service
      # stale, so fetch the full history.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      # Twin built from THIS checkout (cached); never the published image —
      # gates must test the code under review, not a release artifact.
      # AGENTS port-lane protocol step 2: probes may not lag the arms —
      # this gate fails the lane before any parity test when a checked-in
      # probes/<svc>.json predates the newest commit touching that service.
      - name: Probe freshness gate
        run: uv run python scripts/probe_freshness.py
      - name: Start robotocore from source
        uses: ./.github/actions/start-twin-from-source
      - name: Run parity tests
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
        run: uv run pytest tests/parity/ -v --tb=short --junitxml=results-parity.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-parity
          path: results-parity.xml
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-parity
          path: .robotocore.log
          include-hidden-files: true
