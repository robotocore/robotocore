name: AWS Parity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  parity-tests:
    name: "AWS parity tests"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      # Twin built from THIS checkout (cached); never the published image —
      # gates must test the code under review, not a release artifact.
      - name: Start robotocore from source
        uses: ./.github/actions/start-twin-from-source
      - name: Run parity tests
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
        run: uv run pytest tests/parity/ -v --tb=short --junitxml=results-parity.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-parity
          path: results-parity.xml
      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-parity
          path: .robotocore.log
