[package]
name = "lambda"
version.workspace = true
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
bytes = "1.5"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
base64 = "0.22"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
s3 = { path = "../s3" }
# Async-invocation destination delivery: SQS records and SNS publishes through
# the events crate's hook registry.
sqs = { path = "../sqs" }
events = { path = "../events" }
# Create-path role gate: moto's put_function resolves the Role ARN against
# its own IAM backend (iam/models.py get_role_by_arn); the twin reads the
# IAM state through iam::bridge.
iam = { path = "../iam" }
regex = "1.10"
