[package]
name = "dynamodb"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native DynamoDB service for robotocore"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
