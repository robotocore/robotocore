[package]
name = "kms"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
tracing = "0.1"
http = "1.0"
base64 = "0.22"
# Real crypto for Sign/Verify, GenerateMac, key pairs, import wrapping and ECDH
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "pem"] }
