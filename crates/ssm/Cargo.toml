[package]
name = "ssm"
version.workspace = true
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
# The /aws/reference/secretsmanager/ rows resolve through the owning
# Secrets Manager store (moto _get_secretsmanager_parameter).
secretsmanager = { path = "../secretsmanager" }
serde_json = "1.0"
serde_yaml = "0.9"
bytes = "1.5"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
