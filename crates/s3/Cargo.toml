[package]
name = "s3"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native S3 service for robotocore"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
md5 = "0.7"
hex = "0.4"
parking_lot = "0.12"
urlencoding = "2.1"
sqs = { path = "../sqs" }
events = { path = "../events" }
