[package]
name = "sqs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native SQS service implementation for robotocore-rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
parking_lot = "0.12"
bytes = "1.0"
md5 = "0.7"
once_cell = "1.19"
regex = "1.10"
urlencoding = "2.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
