[package]
name = "kinesis"
version.workspace = true
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
bytes = "1.5"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
base64 = "0.22"
md5 = "0.8"
# Cross-service metric push (moto 5.2.4: put_record/put_records publish
# IncomingBytes/IncomingRecords to CloudWatch) via cloudwatch's ingest bridge.
cloudwatch = { path = "../cloudwatch" }
