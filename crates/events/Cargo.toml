[package]
name = "events"
version.workspace = true
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
# `preserve_order` keeps parsed JSON object keys in document order so
# pattern-matcher dict leaves resolve their FIRST key like moto's
# `list(pattern.items())[0]` (models.py:1022) — Python dict order.
serde_json = { version = "1.0", features = ["preserve_order"] }
bytes = "1.5"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
once_cell = "1.19"
sqs = { path = "../sqs" }
