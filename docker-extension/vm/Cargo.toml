[package]
name = "robotocore-extension-vm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Backend service for the Robotocore Docker Desktop extension"

# The extension image builds this directory with its own docker context
# (`docker build docker-extension/`), so it must not inherit the
# repository workspace: the empty [workspace] table detaches it.
[workspace]

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
http = "1.0"

[profile.release]
strip = true
